name: Brand HTML
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow indexing in the app bundle
        run: |
          python3 << 'PY'
          from pathlib import Path
          old = "noindex, nofollow"
          new = "index, follow"
          n = 0
          files = 0
          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue
              if p.suffix.lower() not in {".js", ".html", ".mjs"}:
                  continue
              raw = p.read_bytes()
              if old.encode() not in raw:
                  continue
              text = raw.decode("utf-8")
              c = text.count(old)
              p.write_text(text.replace(old, new), encoding="utf-8")
              n += c
              files += 1
              print("patched", c, p)
          print("count", n, "files", files)
          if n != 8 or files != 1:
              raise SystemExit("unexpected count")
          PY
      - name: Commit
        run: |
          git config user.name "erikscalegroup-blip"
          git config user.email "erikscalegroup@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "SEO: povolit indexovanie v aplikacii"
            git push
          fi
