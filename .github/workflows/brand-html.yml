name: Brand HTML
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove the large Google Maps button
        run: |
          python3 << 'PY'
          from pathlib import Path
          js_path = Path("brand.js")
          js = js_path.read_text(encoding="utf-8")
          old = """    var link="https://www.google.com/maps/place/Moyzesova+4,+902+01+Pezinok/@48.284158,17.2705815,17z";
              var src="https://maps.google.com/maps?q=Moyzesova+4,+902+01+Pezinok&ll=48.284158,17.2705815&z=17&hl=sk&output=embed";
              box.innerHTML='<div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"><div><span class="stitok">Kde n\\u00e1s n\\u00e1jdete</span><h2 class="t-nadpis mt-3">'+ADRESA+'</h2></div><a class="btn btn-modra" href="'+link+'" target="_blank" rel="noopener noreferrer">Otvori\\u0165 v Google map\\u00e1ch</a></div><div class="mteq-mapa-ram mt-6"><iframe title="Mapa s\\u00eddla M-TEQ, Moyzesova 4, Pezinok" src="'+src+'" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>';
          """
          new = """    var src="https://maps.google.com/maps?q=Moyzesova+4,+902+01+Pezinok&ll=48.284158,17.2705815&z=17&hl=sk&output=embed";
              box.innerHTML='<div><span class="stitok">Kde n\\u00e1s n\\u00e1jdete</span><h2 class="t-nadpis mt-3">'+ADRESA+'</h2></div><div class="mteq-mapa-ram mt-6"><iframe title="Mapa s\\u00eddla M-TEQ, Moyzesova 4, Pezinok" src="'+src+'" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>';
          """
          if js.count(old) != 1:
              raise SystemExit("map block count " + str(js.count(old)))
          js = js.replace(old, new, 1)
          if "btn-modra" in js[js.find("function mapa"):js.find("function paint")]:
              raise SystemExit("button still in mapa")
          js_path.write_text(js, encoding="utf-8")
          print("brand.js patched", len(js))
          n = 0
          for p in Path(".").rglob("*.html"):
              html = p.read_text(encoding="utf-8")
              orig = html
              html = html.replace('brand.js?v=20261106d"', 'brand.js?v=20261106e"')
              if html != orig:
                  p.write_text(html, encoding="utf-8")
                  n += 1
                  print("patched", p)
          print("count", n)
          PY
      - name: Commit
        run: |
          git config user.name "erikscalegroup-blip"
          git config user.email "erikscalegroup@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Kontakt: prec velke tlacidlo mapy"
            git push
          fi
