name: Brand HTML
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sticky call button stays on one line
        run: |
          python3 << 'PY'
          from pathlib import Path
          js = Path("brand.js")
          text = js.read_text(encoding="utf-8")
          rule = "a.fixed[href='tel:+421902639923']{flex-wrap:nowrap!important;white-space:nowrap!important;width:max-content;max-width:calc(100vw - 2rem)}"
          if rule not in text:
              needle = "a.mteq-telefon:hover{border-color:#fff;color:#fff;background:transparent}"
              if needle not in text:
                  raise SystemExit("needle missing")
              text = text.replace(needle, needle + "\"\n    +\"" + rule, 1)
              js.write_text(text, encoding="utf-8")
              print("css added")
          else:
              print("css already there")
          n = 0
          for p in Path(".").rglob("*.html"):
              html = p.read_text(encoding="utf-8")
              orig = html
              html = html.replace('brand.js?v=20261106"', 'brand.js?v=20261106b"')
              if html != orig:
                  p.write_text(html, encoding="utf-8")
                  n += 1
                  print("patched", p)
          print("count", n)
          PY
      - name: Commit
        run: |
          git config user.name "erikscalegroup-blip"
          git config user.email "erikscalegroup@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Telefon na mobile ostava v jednom riadku"
            git push
          fi
