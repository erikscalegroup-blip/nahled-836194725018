name: Brand HTML
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Google verification and allow indexing
        run: |
          python3 << 'PY'
          from pathlib import Path
          old = '<meta name="robots" content="noindex, nofollow"/>'
          new = '<meta name="google-site-verification" content="MnWOvlFbTV9R_dwkuDHAJrtEfhLT_8i6qFWrP-y4D1U"/>'
          n = 0
          for p in Path(".").rglob("*.html"):
              html = p.read_text(encoding="utf-8")
              c = html.count(old)
              if c == 0:
                  continue
              if c != 1:
                  raise SystemExit("count %s in %s" % (c, p))
              p.write_text(html.replace(old, new, 1), encoding="utf-8")
              n += 1
              print("patched", p)
          print("count", n)
          if n != 7:
              raise SystemExit("html count %s" % n)
          PY
      - name: Commit
        run: |
          git config user.name "erikscalegroup-blip"
          git config user.email "erikscalegroup@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "SEO: overenie Google a indexovanie"
            git push
          fi
