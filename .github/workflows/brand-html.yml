name: Brand HTML
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache bust and fix form text
        run: |
          python3 << 'PY'
          from pathlib import Path
          js = Path("assets/dopyt-DVGuLqJT.js")
          raw = js.read_bytes()
          fixed = raw.replace("odoslan\u00f9".encode("utf-8"), "odoslan\u00fd".encode("utf-8"))
          if fixed != raw:
              js.write_bytes(fixed)
              print("fixed odoslany")
          else:
              print("form text already ok", b"1e2f2602" in raw)
          n = 0
          for p in Path(".").rglob("*.html"):
              text = p.read_text(encoding="utf-8")
              orig = text
              text = text.replace("brand.js?v=20261104", "brand.js?v=20261106")
              if "dopyt-DVGuLqJT.js?v=" not in text:
                  text = text.replace("/assets/dopyt-DVGuLqJT.js", "/assets/dopyt-DVGuLqJT.js?v=20261106")
              if text != orig:
                  p.write_text(text, encoding="utf-8")
                  n += 1
                  print("patched", p)
          print("count", n)
          PY
      - name: Commit
        run: |
          git config user.name "erikscalegroup-blip"
          git config user.email "erikscalegroup@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Cache: novy brand.js a formular"
            git push
          fi
